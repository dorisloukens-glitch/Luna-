<!doctype html>
<html lang="ht"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050b14">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>World X Luna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-sized app (glass panels, 3D chart, globe, orb buttons) centered on a stage; side menu on desktop only. */
:root{
  --bg:#030a14; --bg2:#06162a; --panel:#0a1f36; --line:rgba(120,230,255,.2);
  --cyan:#38e8ff; --cyan2:#1aa7c4; --ice:#c4f7ff; --amber:#ffb86b; --mint:#4df0a8; --rose:#ff6b86; --violet:#9b8cff;
  --text:#e6f7ff; --muted:#86a9bd; --glass:linear-gradient(150deg,rgba(56,232,255,.13),rgba(56,232,255,.03));
  --display:'Chakra Petch','Segoe UI',system-ui,sans-serif; --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 70% -10%,#0b2a48 0%,transparent 60%),radial-gradient(900px 600px at 0% 100%,#06324a 0%,transparent 55%),var(--bg);color:var(--text);font-family:var(--body);font-size:14px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(56,232,255,.035) 1px,transparent 1px) 0 0/100% 44px,linear-gradient(90deg,rgba(56,232,255,.035) 1px,transparent 1px) 0 0/44px 100%;mask-image:radial-gradient(circle at 50% 40%,#000,transparent 75%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;position:relative;z-index:1}
.side{width:290px;display:none;flex-direction:column;gap:18px}
.side h1{font-family:var(--display);font-size:30px;line-height:1.05;margin:0;letter-spacing:.04em;text-transform:uppercase}
.side h1 span{color:var(--cyan);text-shadow:0 0 24px rgba(56,232,255,.6)}
.side p{margin:0;color:var(--muted);line-height:1.55}
.side .lab{font-family:var(--display);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button,.seg button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:600;transition:.2s}
.jump button:hover,.seg button:hover{color:var(--ice);border-color:var(--cyan)}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;border:1px solid var(--line);background:rgba(3,10,20,.6)}
.seg button{border:0}
.seg button.on{background:linear-gradient(180deg,rgba(56,232,255,.35),rgba(56,232,255,.12));color:var(--ice);box-shadow:0 0 16px -4px var(--cyan)}
@media(min-width:960px){.side{display:flex}}
.phone{position:relative;width:392px;max-width:100%;height:min(840px,100%);border-radius:44px;border:1px solid rgba(120,230,255,.35);background:radial-gradient(420px 300px at 0% 0%,rgba(255,184,107,.1),transparent 60%),radial-gradient(500px 360px at 80% -5%,rgba(56,232,255,.16),transparent 65%),linear-gradient(180deg,#061327,#030a14 70%);
  box-shadow:0 0 0 8px #06101d,0 0 0 9px rgba(120,230,255,.28),0 60px 120px -30px rgba(56,232,255,.4);overflow:hidden;display:flex;flex-direction:column;perspective:1100px}
@media(max-width:600px){.phone{width:100%;height:100%;border-radius:28px;box-shadow:0 0 0 1px rgba(120,230,255,.3),0 30px 80px -30px rgba(56,232,255,.4)}}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px 16px 112px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:rgba(56,232,255,.3) transparent}
.view>*{flex-shrink:0}
.ic{width:20px;height:20px;flex:none}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:600;letter-spacing:.02em}
h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ice)}
.muted{color:var(--muted)} .num{font-family:var(--display);font-variant-numeric:tabular-nums}
.tiny{font-size:12px}
/* Glass + 3D tilt */
.glass{position:relative;border-radius:20px;border:1px solid var(--line);background:var(--glass);padding:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -20px 40px -30px rgba(56,232,255,.25),0 22px 40px -22px rgba(0,0,0,.85),0 0 28px -14px var(--cyan)}
[data-tilt]{transform-style:preserve-3d;transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out}
.pop,.pop2{transition:transform .25s ease-out}
[data-tilt]:hover .pop{transform:translateZ(22px)} [data-tilt]:hover .pop2{transform:translateZ(38px)}
.flat [data-tilt],.flat .pop,.flat .pop2{transform:none!important}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;border:1px solid var(--line);color:var(--ice);background:rgba(56,232,255,.08);white-space:nowrap}
.chip.todo{color:var(--muted);background:rgba(134,169,189,.1);border-color:rgba(134,169,189,.3)}
.chip.doing{color:var(--cyan)} .chip.done{color:var(--mint);background:rgba(77,240,168,.1);border-color:rgba(77,240,168,.35)}
.chip.late{color:var(--amber);background:rgba(255,184,107,.1);border-color:rgba(255,184,107,.4)}
.chip.vio{color:var(--violet);background:rgba(155,140,255,.1);border-color:rgba(155,140,255,.4)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.pulse{animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.35}}
.av{--h:195;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:700;font-size:13px;color:#021018;background:radial-gradient(circle at 30% 25%,hsl(var(--h) 100% 88%),hsl(var(--h) 90% 55%) 60%,hsl(var(--h) 90% 32%));box-shadow:0 6px 14px -4px hsl(var(--h) 90% 50%/.6),inset 0 1px 0 rgba(255,255,255,.6)}
.av.sm{width:30px;height:30px;font-size:11px}.av.lg{width:64px;height:64px;font-size:22px}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);background:linear-gradient(160deg,rgba(56,232,255,.16),rgba(56,232,255,.04));color:var(--ice);position:relative;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 16px -8px #000}
.ib:hover{border-color:var(--cyan);box-shadow:0 0 18px -4px var(--cyan)}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--amber);color:#1a0f00;font:700 10.5px var(--display);display:grid;place-items:center;padding:0 4px}
.top{display:flex;align-items:center;gap:12px}
.top .who{flex:1;min-width:0}
.top .who b{display:block;font-family:var(--display);font-size:18px;letter-spacing:.02em}
.top .who span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:flex;align-items:center;gap:12px}
.sub h1{flex:1;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border-radius:16px;border:1px solid var(--line);background:rgba(3,10,20,.65);box-shadow:inset 0 2px 10px rgba(0,0,0,.5),0 0 0 0 rgba(56,232,255,0);transition:.2s;color:var(--muted)}
.search:focus-within{border-color:var(--cyan);box-shadow:inset 0 2px 10px rgba(0,0,0,.5),0 0 24px -6px var(--cyan);color:var(--cyan)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15px}
.search input::placeholder{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:14px;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:#021018;background:linear-gradient(180deg,#8ff3ff,#26cfee 60%,#139dbd);box-shadow:0 5px 0 #0a5f7c,0 14px 28px -8px rgba(56,232,255,.55),inset 0 1px 0 rgba(255,255,255,.7);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0a5f7c,0 6px 14px -8px rgba(56,232,255,.55),inset 0 1px 0 rgba(255,255,255,.7)}
.btn.ghost{color:var(--ice);background:linear-gradient(160deg,rgba(56,232,255,.16),rgba(56,232,255,.04));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 5px 0 rgba(4,40,60,.9)}
.btn.mint{background:linear-gradient(180deg,#b6ffe0,#4df0a8 60%,#1fb877);box-shadow:0 5px 0 #0d6a46,0 14px 28px -8px rgba(77,240,168,.5),inset 0 1px 0 rgba(255,255,255,.7)}
.btn.sm{height:36px;padding:0 14px;font-size:12px;border-radius:12px;box-shadow:0 3px 0 #0a5f7c,0 10px 18px -8px rgba(56,232,255,.5),inset 0 1px 0 rgba(255,255,255,.7)}
.btn.block{width:100%}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:600 11px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:rgba(3,10,20,.65);outline:0;box-shadow:inset 0 2px 8px rgba(0,0,0,.5)}
.field input:focus,.field select:focus{border-color:var(--cyan);box-shadow:inset 0 2px 8px rgba(0,0,0,.5),0 0 20px -6px var(--cyan)}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row>.grow{flex:1;min-width:0}
.row b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(150deg,rgba(56,232,255,.09),rgba(56,232,255,.02));text-align:left;width:100%;min-width:0;transition:.2s}
button.item:hover{border-color:var(--cyan);box-shadow:0 0 22px -8px var(--cyan)}
.state{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;background:rgba(56,232,255,.1);color:var(--cyan);border:1px solid var(--line)}
.state.done{color:var(--mint);background:rgba(77,240,168,.1);border-color:rgba(77,240,168,.35)}
.state.late{color:var(--amber);background:rgba(255,184,107,.1);border-color:rgba(255,184,107,.4)}
.state.todo{color:var(--muted);background:rgba(134,169,189,.08)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:12.5px;white-space:nowrap}
.filters button.on{color:var(--ice);background:rgba(56,232,255,.16);border-color:var(--cyan);box-shadow:0 0 16px -6px var(--cyan)}
/* Tab dock */
.tabs{position:absolute;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(14,48,78,.92),rgba(5,18,34,.96));box-shadow:0 20px 40px -10px #000,0 0 30px -10px var(--cyan),inset 0 1px 0 rgba(255,255,255,.14);z-index:5}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.04em;transition:.25s;position:relative}
.tabs button .ic{width:23px;height:23px;transition:.25s}
.tabs button.on{color:var(--cyan)}
.tabs button.on .ic{transform:translateY(-5px) scale(1.15);filter:drop-shadow(0 0 8px var(--cyan)) drop-shadow(0 8px 6px rgba(0,0,0,.6))}
.tabs button.on::after{content:"";position:absolute;bottom:-1px;width:26px;height:3px;border-radius:2px;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.tabs .badge{top:0;right:calc(50% - 20px)}
/* ring */
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 10px rgba(56,232,255,.55))}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font:700 30px var(--display)}.ring .c span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;gap:8px;flex:1;min-width:0}
.stat{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:12px;background:rgba(3,10,20,.5);border:1px solid var(--line)}
.stat b{font:700 20px var(--display)}
.stat span{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
/* 3D bars */
.scene{perspective:820px;height:210px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:34px;cursor:grab;touch-action:pan-y}
.stage3d{position:relative;display:flex;gap:18px;align-items:flex-end;height:150px;transform-style:preserve-3d;transform:rotateX(var(--sx,-22deg)) rotateY(var(--sy,-24deg));transition:transform .2s ease-out}
.floorp{position:absolute;left:-26px;right:-26px;bottom:0;height:62px;transform-origin:50% 100%;transform:translateZ(31px) rotateX(90deg);border:1px solid var(--line);border-radius:6px;
  background:linear-gradient(rgba(56,232,255,.3) 1px,transparent 1px) 0 0/100% 15px,linear-gradient(90deg,rgba(56,232,255,.3) 1px,transparent 1px) 0 0/22px 100%,rgba(56,232,255,.06);box-shadow:0 0 40px rgba(56,232,255,.25)}
.bar{position:relative;width:24px;height:4px;transform-style:preserve-3d}
.grow .bar{height:var(--h);transition:height .9s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i)*70ms)}
.bar i{position:absolute;display:block}
.bar .f{inset:0;transform:translateZ(12px);background:linear-gradient(180deg,#7ff1ff,#1db8dc 55%,#0e789b);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 0 18px rgba(56,232,255,.35)}
.bar .r{top:0;right:-12px;width:24px;height:100%;transform:rotateY(90deg);background:linear-gradient(180deg,#1a9cc4,#0a5578)}
.bar .t{left:0;top:-12px;width:100%;height:24px;transform:rotateX(90deg);background:#c9faff;box-shadow:0 0 16px #8ff3ff}
.bar.hi .f{background:linear-gradient(180deg,#fff,#a8f7ff 40%,#38e8ff);box-shadow:0 0 28px rgba(196,247,255,.7)}
.bar .lbl{position:absolute;top:100%;left:50%;transform:translate(-50%,36px) translateZ(34px);font:600 10.5px var(--display);color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.bar.hi .lbl{color:var(--ice)}
.bar .val{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-14px) translateZ(12px);font:700 12px var(--display);color:var(--ice);text-shadow:0 0 10px var(--cyan)}
.hint{font-size:11.5px;color:var(--muted);text-align:center;margin-top:10px}
/* rank */
.rank{display:flex;flex-direction:column;gap:12px}
.rk{display:grid;grid-template-columns:30px 1fr 34px;align-items:center;gap:10px}
.rk .tr{height:9px;border-radius:5px;background:rgba(3,10,20,.7);box-shadow:inset 0 1px 3px #000;overflow:hidden}
.rk .tr i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--cyan2),var(--cyan));box-shadow:0 0 14px var(--cyan);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.rk.low .tr i{background:linear-gradient(90deg,#b86f1a,var(--amber));box-shadow:0 0 14px var(--amber)}
.rk .n{font:700 14px var(--display);text-align:right}
.tl{display:grid;grid-template-columns:70px 1fr 44px;align-items:center;gap:10px;margin-bottom:11px}
.tl:last-child{margin-bottom:0}
.tl .tr{position:relative;height:2px;background:rgba(120,230,255,.25)}
.tl .tr i{position:absolute;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);transform:translateX(-50%)}
.tl .tr i.l{background:var(--amber);box-shadow:0 0 12px var(--amber)}
.tl .tr s{position:absolute;left:33.3%;top:-9px;height:20px;border-left:1px dashed rgba(255,255,255,.3)}
.tl span{font:600 12px var(--display);text-align:right}
.tl .nm{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* orb */
.orbwrap{position:relative;height:250px;display:grid;place-items:center;perspective:700px}
.rings{position:absolute;width:250px;height:250px;transform:rotateX(68deg) translateY(38px);transform-style:preserve-3d;pointer-events:none}
.rings i{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(56,232,255,.5);box-shadow:0 0 22px rgba(56,232,255,.4),inset 0 0 22px rgba(56,232,255,.25);animation:rg 3.2s infinite ease-out;opacity:0}
.rings i:nth-child(2){animation-delay:1.05s}.rings i:nth-child(3){animation-delay:2.1s}
@keyframes rg{0%{transform:scale(.45);opacity:.9}100%{transform:scale(1.05);opacity:0}}
.orb{--a:#b8fbff;--b:#2fd6f2;--c:#0a6f94;--d:#06506d;--g:rgba(56,232,255,.6);position:relative;z-index:2;width:164px;height:164px;border-radius:50%;display:grid;place-content:center;gap:4px;text-align:center;font-family:var(--display);font-weight:700;color:#021018;
  background:radial-gradient(circle at 35% 26%,var(--a),var(--b) 40%,var(--c) 82%);box-shadow:0 14px 0 var(--d),0 34px 50px -8px var(--g),inset 0 5px 12px rgba(255,255,255,.65),inset 0 -12px 24px rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s;transform:translateY(-8px)}
.orb:active{transform:translateY(2px);box-shadow:0 4px 0 var(--d),0 14px 30px -8px var(--g),inset 0 5px 12px rgba(255,255,255,.65),inset 0 -12px 24px rgba(0,0,0,.25)}
.orb .ic{width:36px;height:36px;margin:0 auto;stroke-width:2.2}
.orb b{font-size:16px;letter-spacing:.1em;text-transform:uppercase}
.orb.mint{--a:#d4ffec;--b:#4df0a8;--c:#12805a;--d:#0b5f42;--g:rgba(77,240,168,.6)}
.orb.amber{--a:#ffe9c9;--b:#ffb86b;--c:#a3560a;--d:#6e3a06;--g:rgba(255,184,107,.55)}
.orb.off{--a:#3a5b70;--b:#27465a;--c:#183142;--d:#0e1f2c;--g:rgba(0,0,0,0);color:var(--muted);cursor:default}
.orb.sm{width:132px;height:132px}
.timer{font:700 34px var(--display);text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.06em;text-shadow:0 0 18px var(--cyan)}
.steps{display:flex;flex-direction:column;gap:0}
.st{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:16px}
.st:last-child{padding-bottom:0}
.st::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:rgba(120,230,255,.2)}
.st:last-child::before{display:none}
.st i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--bg2)}
.st.on i{border-color:var(--cyan);background:var(--cyan);color:#021018;box-shadow:0 0 14px var(--cyan)}
.st.on i .ic{width:14px;height:14px;stroke-width:3}
.st b{display:block}.st small{color:var(--muted);font-size:12px}
/* chat */
.msgs{display:flex;flex-direction:column;gap:10px;flex:1}
.m{max-width:80%;padding:10px 14px;border-radius:18px 18px 18px 6px;background:linear-gradient(150deg,rgba(56,232,255,.12),rgba(56,232,255,.04));border:1px solid var(--line);line-height:1.45;overflow-wrap:anywhere}
.m small{display:block;color:var(--muted);font-size:11px;margin-top:4px;text-align:right}
.m .by{display:block;font:700 11px var(--display);letter-spacing:.06em;color:var(--cyan);margin-bottom:3px}
.m.me{align-self:flex-end;border-radius:18px 18px 6px 18px;background:linear-gradient(160deg,#2ad3ef,#0f87aa);color:#021018;border-color:rgba(255,255,255,.3);box-shadow:0 10px 20px -10px var(--cyan)}
.m.me small{color:rgba(2,16,24,.7)}
.wave{display:flex;align-items:center;gap:8px}
.wave .w{display:flex;align-items:center;gap:2px;height:26px}

V.chats=()=>`<div class="view"><div class="sub"><h1>Chat</h1><button class="ib" data-act="sheet" data-arg="newchat" aria-label="Nouvo mesaj">${I('plus')}</button></div>${searchBox('chats','Chèche yon konvèsasyon...')}

const chatList=()=>S.chats.filter(c=>c.n.toLowerCase().includes((S.q.chats||'').toLowerCase())).map(c=>`<button class="item" data-act="chat" data-arg="${c.id}">${c.task?`<span class="state">${I('tasks')}</span>`:c.g?`<span class="state">${I('users')}</span>`:av(c.n)}<span style="flex:1;min-width:0"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.n)}</b><small class="muted tiny" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.last)}</small></span><span style="text-align:right"><small class="muted tiny" style="display:block">${c.t}</small>${c.u?`<span class="chip done" style="padding:1px 7px;margin-top:4px">${c.u}</span>`:''}</span></button>`).join('');
const msgHtml=(m,g)=>{const mine=m.w===me();let body='';
 if(m.k==='t')body=esc(m.x);
 if(m.k==='v')body=`<div class="wave">${I('play')}<div class="w">${[8,16,10,22,14,24,12,18,8,20,12,16,8].map(h=>`<i style="height:${h}px"></i>`).join('')}</div><span class="tiny">${m.d}</span></div>`;
 if(m.k==='p')body=`<div class="pic">${I('image')}</div>${esc(m.x||'')}`;
 if(m.k==='d')body=`<div class="row">${I('file')}<div class="grow"><b style="white-space:normal">${esc(m.x)}</b><small style="color:inherit;opacity:.7">${m.s}</small></div></div>`;
 return `<div class="m ${mine?'me':''}">${g&&!mine?`<span class="by">${esc(m.w.split(' ')[0])}</span>`:''}${body}<small>${m.t}</small></div>`};
V.chatroom=()=>{const c=S.chats.find(x=>x.id===S.chat);return `<div class="view" style="padding-bottom:12px" id="chatview"><div class="sub"><button class="ib" data-act="go" data-arg="chats" aria-label="Retounen">${I('back')}</button>${c.task?`<span class="state">${I('tasks')}</span>`:c.g?`<span class="state">${I('users')}</span>`:av(c.n)}<div style="flex:1;min-width:0"><b style="display:block;font-family:var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.n)}</b><small class="muted tiny">${c.g?'6 manm · an liy':'an liy'}</small></div></div>
 <div class="msgs">${c.msgs.map(m=>msgHtml(m,c.g)).join('')}</div></div>
 <form class="composer" id="cform"><button type="button" class="ib" data-act="toast" data-arg="Chwazi yon foto oswa yon dokiman" aria-label="Foto">${I('image')}</button><input id="cin" placeholder="Ekri yon mesaj..." autocomplete="off"><button type="button" class="ib" data-act="toast" data-arg="Kenbe pou anrejistre yon mesaj vwa" aria-label="Mesaj vwa">${I('mic')}</button><button class="ib" style="background:linear-gradient(160deg,#7ff1ff,#1db8dc);color:#021018" aria-label="Voye">${I('send')}</button></form>`};

V.calendar=()=>{const now=new Date(),Y=now.getFullYear(),M=now.getMonth(),today=now.getDate(),nd=new Date(Y,M+1,0).getDate(),off=new Date(Y,M,1).getDay(),d=S.calDay||today,E=S.ev[d]||[],col={c:'var(--cyan)',a:'var(--amber)',v:'var(--violet)'},
 MN=['Janvye','Fevriye','Mas','Avril','Me','Jen','Jiyè','Out','Septanm','Oktòb','Novanm','Desanm'],can=['boss','emp'].includes(S.role)&&(!LIVE.role||['boss','manager'].includes(LIVE.role));
 return `<div class="view">${topSub('Kalandriye','more',can?`<button class="btn sm" data-act="sheet" data-arg="newev">${I('plus')}Evènman</button>`:'')}
 <div class="glass" data-tilt><div class="card-h"><h2>${MN[M]} ${Y}</h2><span class="chip">Jodi a: ${today}</span></div><div class="cal pop">${['D','L','M','M','J','V','S'].map(x=>`<div class="h">${x}</div>`).join('')}${Array.from({length:off},()=>'<div></div>').join('')}${Array.from({length:nd},(_,i)=>{const n=i+1;return `<button class="${n===today?'today':''} ${n===d?'sel':''}" data-act="day" data-arg="${n}">${n}<span class="ds">${(S.ev[n]||[]).map(e=>`<i style="background:${n===d?'#021018':col[e[2]]}"></i>`).join('')}</span></button>`}).join('')}</div></div>
 <div class="row tiny muted" style="gap:14px;justify-content:center"><span class="row" style="gap:5px"><i class="dot" style="color:var(--cyan)"></i>Reyinyon</span><span class="row" style="gap:5px"><i class="dot" style="color:var(--amber)"></i>Dat limit</span><span class="row" style="gap:5px"><i class="dot" style="color:var(--violet)"></i>Konje</span></div>

/* ---------- 3D globe ---------- */
const CITIES=[['Pòtoprens',18.54,-72.34],['Santo Domingo',18.48,-69.93],['Miami',25.76,-80.19],['Montréal',45.5,-73.57],['New York',40.71,-74.0],['Paris',48.85,2.35],['Lagos',6.52,3.38],['São Paulo',-23.55,-46.63],['Dubai',25.2,55.27],['Tokyo',35.68,139.69]];
const land=(x,y,z,la,lo)=>{if(Math.hypot(la-18.9,lo+72.3)<6)return true;const n=Math.sin(x*2.3+1.2)*Math.cos(y*2.9-.4)+Math.sin(z*3.1+x*1.7)*.9+Math.sin((x+y+z)*4.2)*.45+Math.cos(y*5.1+z*2.2)*.35;return n>.28&&Math.abs(la)<78};
const D=Math.PI/180;
function Globe(el,login){const cv=el.querySelector('canvas'),ctx=cv.getContext('2d');const g=this;
 g.rot=72.3;g.pitch=login?14:16;g.zoom=1;g.tgt=null;g.sel=0;g.drag=false;if(!login)window._g=g;
 const pts=[],N=5200;for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),th=i*2.399963,x=Math.cos(th)*r,z=Math.sin(th)*r,la=Math.asin(y)/D,lo=Math.atan2(x,z)/D;pts.push({la,lo,l:land(x,y,z,la,lo)})}
 const vis=pts.filter((p,i)=>p.l||i%7===0);
 const people=Array.from({length:46},(_,i)=>({a:Math.random()*6.28,r:Math.random()*3.2,s:.2+Math.random()*.6,o:Math.random()*9}));
 const P=(la,lo,k=1)=>{const a=la*D,b=(lo+g.rot)*D,x=Math.cos(a)*Math.sin(b),y=Math.sin(a),z=Math.cos(a)*Math.cos(b),p=g.pitch*D,y2=y*Math.cos(p)-z*Math.sin(p),z2=y*Math.sin(p)+z*Math.cos(p);return[x*k,y2*k,z2*k]};
 const V3=(la,lo)=>{const a=la*D,b=lo*D;return[Math.cos(a)*Math.sin(b),Math.sin(a),Math.cos(a)*Math.cos(b)]};
 let W,H,dpr,R,cx,cy,t0=performance.now(),last=0;
 const size=()=>{dpr=Math.min(2,devicePixelRatio||1);W=el.clientWidth;H=el.clientHeight;cv.width=W*dpr;cv.height=H*dpr};size();
 const S2=(p)=>[cx+p[0]*R,cy-p[1]*R,p[2]];
 function frame(now){if(!el.isConnected)return;requestAnimationFrame(frame);if(now-last<30)return;last=now;if(el.clientWidth!==W||el.clientHeight!==H)size();
  if(g.tgt){const T=g.tgt;g.rot+=(T.rot-g.rot)*.07;g.pitch+=(T.pitch-g.pitch)*.07;g.zoom+=(T.zoom-g.zoom)*.07;const z=$('#zm');if(z)z.value=g.zoom}
  else if(!g.drag)g.rot+=login?.25:.12;
  R=Math.min(W,H)*.4*g.zoom;cx=W/2;cy=H/2;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  const gl=ctx.createRadialGradient(cx,cy,R*.9,cx,cy,R*1.35);gl.addColorStop(0,'rgba(56,232,255,.28)');gl.addColorStop(1,'rgba(56,232,255,0)');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(cx,cy,R*1.35,0,7);ctx.fill();
  const bd=ctx.createRadialGradient(cx-R*.3,cy-R*.35,R*.1,cx,cy,R);bd.addColorStop(0,'rgba(30,120,170,.55)');bd.addColorStop(1,'rgba(4,22,44,.85)');ctx.fillStyle=bd;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
  ctx.strokeStyle='rgba(120,240,255,.7)';ctx.lineWidth=1.4;ctx.shadowColor='#38e8ff';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(56,232,255,.13)';ctx.lineWidth=1;
  for(let lo=-180;lo<180;lo+=30){ctx.beginPath();let on=false;for(let la=-90;la<=90;la+=6){const p=P(la,lo);if(p[2]>0){const s=S2(p);on?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1]);on=true}else on=false}ctx.stroke()}
  for(let la=-60;la<=60;la+=30){ctx.beginPath();let on=false;for(let lo=-180;lo<=180;lo+=6){const p=P(la,lo);if(p[2]>0){const s=S2(p);on?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1]);on=true}else on=false}ctx.stroke()}
  const ds=Math.max(.9,1.15*Math.sqrt(g.zoom));
  for(const p of vis){const q=P(p.la,p.lo);if(q[2]<=0)continue;const s=S2(q);ctx.fillStyle=p.l?`rgba(130,245,255,${.3+.65*q[2]})`:`rgba(56,232,255,${.08+.1*q[2]})`;const d=p.l?ds*(.7+.6*q[2]):ds*.55;ctx.fillRect(s[0]-d/2,s[1]-d/2,d,d)}
  const ht=V3(18.54,-72.34),T=(now-t0)/1000;
  CITIES.forEach((c,i)=>{if(i===0)return;const b=V3(c[1],c[2]),om=Math.acos(Math.max(-1,Math.min(1,ht[0]*b[0]+ht[1]*b[1]+ht[2]*b[2])));if(om<.05)return;
   const pt=u=>{const k=Math.sin((1-u)*om)/Math.sin(om),m=Math.sin(u*om)/Math.sin(om),v=[0,1,2].map(j=>k*ht[j]+m*b[j]),h=1+.2*Math.sin(Math.PI*u),la=Math.asin(v[1])/D,lo=Math.atan2(v[0],v[2])/D;return P(la,lo,h)};
   ctx.strokeStyle='rgba(255,184,107,.55)';ctx.lineWidth=1.2;ctx.beginPath();let on=false;for(let u=0;u<=1.001;u+=.04){const q=pt(u);if(q[2]>0){const s=S2(q);on?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1]);on=true}else on=false}ctx.stroke();
   const u=((T*.25+i*.13)%1),q=pt(u);if(q[2]>0){const s=S2(q);ctx.fillStyle='#fff';ctx.shadowColor='#ffb86b';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(s[0],s[1],2.2,0,7);ctx.fill();ctx.shadowBlur=0}});
  CITIES.forEach((c,i)=>{const q=P(c[1],c[2]);if(q[2]<=.02)return;const s=S2(q),h=i===0,pr=(T*.8+i*.4)%1;
   ctx.strokeStyle=`rgba(255,184,107,${.7*(1-pr)})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(s[0],s[1],4+pr*14,0,7);ctx.stroke();
   ctx.fillStyle=h?'#ffb86b':'#c4f7ff';ctx.shadowColor=h?'#ffb86b':'#38e8ff';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(s[0],s[1],h?4.5:3,0,7);ctx.fill();ctx.shadowBlur=0;
   if(!login&&(h||g.sel===i||g.zoom>1.7)){ctx.font='600 11px Manrope,sans-serif';ctx.fillStyle='#e6f7ff';ctx.textAlign='left';ctx.fillText(c[0],s[0]+9,s[1]+4)}});
  if(g.zoom>1.9&&!login){let n=0;people.forEach(p=>{const la=18.54+Math.sin(T*p.s+p.o)*.9+p.r*.18*Math.cos(p.a),lo=-72.34+Math.cos(T*p.s*.8+p.o)*1.2+p.r*.24*Math.sin(p.a),q=P(la,lo);if(q[2]<=0)return;n++;const s=S2(q);ctx.fillStyle='#ffd9a8';ctx.shadowColor='#ffb86b';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(s[0],s[1],1.8,0,7);ctx.fill();ctx.shadowBlur=0})}
  const gp=$('#gpeople');if(gp)gp.textContent=(g.zoom>1.9?'Moun k ap mache nan Pòtoprens':'1,248 moun an dirèk')}
 requestAnimationFrame(frame);
 if(!login){let lx,ly,moved;
  el.addEventListener('pointerdown',e=>{g.drag=true;g.tgt=null;lx=e.clientX;ly=e.clientY;moved=0;el.setPointerCapture(e.pointerId);el.style.cursor='grabbing'});
  el.addEventListener('pointermove',e=>{if(!g.drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);g.rot+=dx*.32/Math.sqrt(g.zoom);g.pitch=Math.max(-60,Math.min(60,g.pitch+dy*.25/Math.sqrt(g.zoom)))});
  el.addEventListener('pointerup',e=>{g.drag=false;el.style.cursor='grab';if(moved<6){const r=el.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=-1,bd=24;CITIES.forEach((c,i)=>{const q=P(c[1],c[2]);if(q[2]<=0)return;const s=S2(q),d=Math.hypot(s[0]-x,s[1]-y);if(d<bd){bd=d;best=i}});if(best>=0)g.sel=best}});
  el.addEventListener('wheel',e=>{e.preventDefault();g.tgt=null;g.zoom=Math.max(1,Math.min(4,g.zoom-e.deltaY*.002));const z=$('#zm');if(z)z.value=g.zoom},{passive:false})}
}

function mountBureau(){const cv=$('#bureau');if(!cv)return;const W=()=>cv.clientWidth,H=()=>cv.clientHeight;
 if(!S.hp)S.hp=HPS.map((h,i)=>({id:h.id,open:h.open,z:i+1,rot:0,x:h.f[0]*W(),y:h.f[1]*H(),w:h.f[2]*W(),h:h.f[3]*H()}));
 const P=id=>S.hp.find(p=>p.id===id),E=id=>cv.querySelector(`.hp[data-id="${id}"]`),D=id=>HPS.find(h=>h.id===id);
 const fit=p=>{const el=E(p.id);if(!el)return;const d=D(p.id),bw=p.w-18,bh=p.h-34-16,k=Math.max(.2,Math.min(bw/d.dw,bh/d.dh)),f=el.querySelector('.fit');f.style.transform=`scale(${k})`;f.style.left=(bw-d.dw*k)/2+'px'};
 const place=p=>{const el=E(p.id);if(!el)return;Object.assign(el.style,{left:p.x+'px',top:p.y+'px',width:p.w+'px',height:p.h+'px',zIndex:p.z,transform:`rotate(${p.rot}deg)`});fit(p)};
 const front=p=>{p.z=Math.max(...S.hp.map(x=>x.z))+1;const el=E(p.id);if(el)el.style.zIndex=p.z};
 S.hp.forEach(p=>{if(p.open)place(p)});
 $('#hpnote')?.addEventListener('input',e=>{S.note=e.target.value});
 const act=new Map();let tapT=0,tapId=null,lt=0;
 const trail=e=>{const n=performance.now();if(n-lt<40)return;lt=n;const r=cv.getBoundingClientRect(),i=document.createElement('i');i.className='trail';i.style.left=e.clientX-r.left+'px';i.style.top=e.clientY-r.top+'px';cv.appendChild(i);setTimeout(()=>i.remove(),520)};
 const fly=p=>{if(p.fly)return;p.fly=true;const step=()=>{if(!p.fly||!E(p.id))return;p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.94;const m=50,w=W(),h=H();
  if(p.x<m-p.w){p.x=m-p.w;p.vx=Math.abs(p.vx)*.6}if(p.x>w-m){p.x=w-m;p.vx=-Math.abs(p.vx)*.6}if(p.y<0){p.y=0;p.vy=Math.abs(p.vy)*.6}if(p.y>h-m){p.y=h-m;p.vy=-Math.abs(p.vy)*.6}
  place(p);if(Math.hypot(p.vx,p.vy)<.3){p.fly=false;return}requestAnimationFrame(step)};requestAnimationFrame(step)};
 const maxi=p=>{const el=E(p.id);el.classList.add('anim');if(p.prev){Object.assign(p,p.prev);p.prev=null}else{p.prev={x:p.x,y:p.y,w:p.w,h:p.h,rot:p.rot};Object.assign(p,{x:6,y:6,w:W()-12,h:H()-12,rot:0})}place(p);setTimeout(()=>el.classList.remove('anim'),500)};
 window._hpArrange=()=>{S.hp.forEach((p,i)=>{const h=HPS[i],el=E(p.id);Object.assign(p,{x:h.f[0]*W(),y:h.f[1]*H(),w:h.f[2]*W(),h:h.f[3]*H(),rot:0,prev:null,fly:false});if(el){el.classList.add('anim');place(p);setTimeout(()=>el.classList.remove('anim'),500)}})};
 cv.addEventListener('pointerdown',e=>{const el=e.target.closest('.hp');if(!el||e.target.closest('button,input,textarea,select,[data-act]'))return;const p=P(el.dataset.id);front(p);
  el.setPointerCapture(e.pointerId);act.set(e.pointerId,{id:p.id,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,rz:!!e.target.closest('.rz'),hh:!!e.target.closest('.hh'),hist:[]});
  el.classList.add('grab');p.vx=p.vy=0;p.fly=false;const same=[...act.values()].filter(a=>a.id===p.id);
  if(same.length===2){const[a,b]=same;p._g={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,a0:Math.atan2(b.y-a.y,b.x-a.x),w:p.w,h:p.h,r:p.rot,cx:p.x+p.w/2,cy:p.y+p.h/2}}});
 cv.addEventListener('pointermove',e=>{const a=act.get(e.pointerId);if(!a)return;const p=P(a.id),dx=e.clientX-a.x,dy=e.clientY-a.y;a.x=e.clientX;a.y=e.clientY;const same=[...act.values()].filter(q=>q.id===p.id);
  if(same.length>=2&&p._g){const[q1,q2]=same,d=Math.hypot(q1.x-q2.x,q1.y-q2.y)||1,an=Math.atan2(q2.y-q1.y,q2.x-q1.x),g=p._g,k=d/g.d0;p.w=clamp(g.w*k,130,W()*1.3);p.h=clamp(g.h*k,100,H()*1.3);p.rot=g.r+(an-g.a0)*180/Math.PI;p.x=g.cx-p.w/2;p.y=g.cy-p.h/2}
  else if(a.rz){p.w=clamp(p.w+dx,130,W()*1.3);p.h=clamp(p.h+dy,100,H()*1.3)}
  else{p.x+=dx;p.y+=dy;const n=performance.now();a.hist.push([n,e.clientX,e.clientY]);a.hist=a.hist.filter(h=>n-h[0]<90);trail(e)}
  place(p)});
 const up=e=>{const a=act.get(e.pointerId);if(!a)return;act.delete(e.pointerId);const p=P(a.id),el=E(p.id);
  if([...act.values()].some(q=>q.id===p.id)){p._g=null;return}
  el&&el.classList.remove('grab');const h=a.hist,n=performance.now();
  if(!a.rz&&h.length>1){const f=h[0],l=h[h.length-1],dt=(l[0]-f[0])||1;p.vx=(l[1]-f[1])/dt*16;p.vy=(l[2]-f[2])/dt*16;if(Math.hypot(p.vx,p.vy)>2)fly(p)}
  if(a.hh&&Math.hypot(e.clientX-a.sx,e.clientY-a.sy)<6){if(tapId===p.id&&n-tapT<320){maxi(p);tapT=0}else{tapId=p.id;tapT=n}}};

 cv.addEventListener('wheel',e=>{const el=e.target.closest('.hp');if(!el)return;e.preventDefault();const p=P(el.dataset.id),k=Math.exp(-e.deltaY*.0015),cx=p.x+p.w/2,cy=p.y+p.h/2;p.w=clamp(p.w*k,130,W()*1.3);p.h=clamp(p.h*k,100,H()*1.3);p.x=cx-p.w/2;p.y=cy-p.h/2;place(p)},{passive:false})}

 S.holo.forEach(p=>{const el=hpEl(p);if(!el)return;if(p.x==null){Object.assign(p,{x:p.fx*W,y:p.fy*Ht,s:1,r:0,vx:0,vy:0,rx:0,ry:0,z:++S.zTop})}hpPlace(el,p)});

function holoDown(e){const el=e.target.closest('.hp');if(!el||e.target.closest('[data-nodrag]'))return;const p=S.holo.find(q=>q.id==el.dataset.id);if(!p)return;

 if(e.target.closest('[data-handle]')){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy;g.handle={cx,cy,d0:Math.max(30,Math.hypot(dx,dy)),a0:Math.atan2(dy,dx),s0:p.s,r0:p.r}}

function holoHit(p,pt){const hit=r=>pt.x>r.left-6&&pt.x<r.right+6&&pt.y>r.top-6&&pt.y<r.bottom+6;let over=null;

  else{const o=[...g.ptr.entries()].find(([id])=>id!==e.pointerId)[1],d0=Math.hypot(prev.x-o.x,prev.y-o.y)||1,d1=Math.hypot(cur.x-o.x,cur.y-o.y),a0=Math.atan2(prev.y-o.y,prev.x-o.x),a1=Math.atan2(cur.y-o.y,cur.x-o.x);

  p.held=false;g.handle=null;el&&el.classList.remove('grab');$$('.drop,.trash').forEach(d=>d.classList.remove('over'));
  const now=performance.now(),tap=g.moved<6&&now-g.t0<300;g.moved=0;g.t0=0;

  S.holo.forEach(p=>{if(p.held)return;const el=hpEl(p);if(!el)return;const mv=Math.abs(p.vx)>.05||Math.abs(p.vy)>.05;

async function loadAll(){
 const u=LIVE.uid;
 const{data:ms,error}=await sb.from('members').select('business_id,role,status,businesses(id,name,code,kind,plan,trial_ends_at)').eq('user_id',u);
 if(error)throw error;LIVE.mine=ms||[];
 const act=LIVE.mine.find(m=>m.status==='active');
 if(!act){LIVE.biz=null;LIVE.loaded=true;return}
 const bz=act.businesses,b=bz.id;LIVE.biz=bz;LIVE.role=act.role;
 const q=(t,f)=>f(sb.from(t));
 const[mem,tk,ch,pr,jb,my,dc,ev,nt,at,aw]=await Promise.all([
  sb.from('members').select('user_id,role,status').eq('business_id',b),
  sb.from('task_state').select('*').eq('business_id',b).order('due_at'),
  sb.from('chats').select('id,kind,name,task_id,created_at').eq('business_id',b),
  sb.from('market').select('*').order('created_at',{ascending:false}),
  sb.from('open_jobs').select('*').order('created_at',{ascending:false}),
  sb.from('job_applications').select('id,job_id,applicant_id,message,status').order('created_at',{ascending:false}),
  sb.from('documents').select('*').eq('business_id',b).order('created_at',{ascending:false}),
  sb.from('events').select('*').eq('business_id',b),
  sb.from('notifications').select('*').eq('user_id',u).order('created_at',{ascending:false}).limit(30),
  sb.from('attendance').select('user_id,clock_in,clock_out').eq('business_id',b).is('clock_out',null),
  sb.from('attendance').select('user_id,clock_in,clock_out').eq('business_id',b).gte('clock_in',new Date(Date.now()-7*864e5).toISOString()).order('clock_in',{ascending:false})]);
 const ids=[...new Set([...(mem.data||[]).map(m=>m.user_id),...(my.data||[]).map(a=>a.applicant_id),u])];
 const{data:pf}=await sb.from('profiles').select('id,full_name').in('id',ids);
 const nm={};(pf||[]).forEach(p=>nm[p.id]=p.full_name||'San non');
 LIVE.names=nm;LIVE.ids=Object.fromEntries(Object.entries(nm).map(([k,v])=>[v,k]));
 const mine=nm[u]||'Mwen';
 BOSS=mine;EMP=mine;BIZ=bz.name;CODE=bz.code;
 S.role=act.role==='employee'?'emp':'boss';
 const here=new Set((at.data||[]).map(a=>a.user_id));
 TEAM.length=0;(mem.data||[]).filter(m=>m.status==='active').forEach(m=>TEAM.push({n:nm[m.user_id],r:ROLE_LBL[m.role]}));
 ROOM.length=0;(mem.data||[]).filter(m=>m.status==='active'&&m.user_id!==u).forEach(m=>ROOM.push([nm[m.user_id],ROLE_LBL[m.role],here.has(m.user_id)?'c':'a']));
 S.pending=(mem.data||[]).filter(m=>m.status==='pending').map(m=>({n:nm[m.user_id],code:bz.code,uid:m.user_id}));
 S.tasks=(tk.data||[]).map(t=>({id:t.id,title:t.title,who:nm[t.assignee_id]||'?',whoId:t.assignee_id,due:hm(t.due_at),place:t.place||'',status:t.is_late?'late':t.status,start:t.started_at?+new Date(t.started_at):undefined,end:t.finished_at?+new Date(t.finished_at):undefined,_fin:t.finished_at,_st:t.started_at}));
 const tt=Object.fromEntries(S.tasks.map(t=>[t.id,t]));
 /* chat: dènye mesaj + manm */
 const cids=(ch.data||[]).map(c=>c.id);let last={},cm={};LIVE.cr={};LIVE.allm=[];LIVE.here=here;
 if(cids.length){const[lm,cmm]=await Promise.all([sb.from('messages').select('chat_id,body,kind,sender_id,created_at').in('chat_id',cids).order('created_at',{ascending:false}).limit(150),sb.from('chat_members').select('chat_id,user_id,last_read_at').in('chat_id',cids)]);
  (lm.data||[]).forEach(m=>{if(!last[m.chat_id])last[m.chat_id]=m});(cmm.data||[]).forEach(x=>{(cm[x.chat_id]??=[]).push(x.user_id);LIVE.cr[x.chat_id+':'+x.user_id]=x.last_read_at});LIVE.allm=lm.data||[]}
 const old=Object.fromEntries((S.chats||[]).map(c=>[c.id,c]));
 S.chats=(ch.data||[]).map(c=>{const l=last[c.id];const other=(cm[c.id]||[]).find(x=>x!==u);
  const n=c.kind==='direct'?(nm[other]||c.name||'Chat dirèk'):c.kind==='task'?'Travay: '+(tt[c.task_id]?.title||c.name||''):(c.name||'Gwoup');
  return{id:c.id,n,last:l?(l.sender_id===u?'Mwen: ':'')+LIVE.prev(l):'',other,cn:(cm[c.id]||[]).length,u:LIVE.allm.filter(m=>m.chat_id===c.id&&m.sender_id!==u&&+new Date(m.created_at)>+new Date(LIVE.cr[c.id+':'+u]||0)).length,t:l?hm(l.created_at):'',g:c.kind==='group'?1:0,task:c.kind==='task'?(c.task_id||1):0,_t:l?+new Date(l.created_at):+new Date(c.created_at),msgs:old[c.id]?.msgs||[]}}).sort((a,b)=>b._t-a._t);
 S.prods=(pr.data||[]).map(p=>({id:p.id,t:p.title,p:Number(p.price).toLocaleString('en-US')+' '+(p.currency==='HTG'?'Goud':p.currency),b:p.business_name,ic:'store',h:170+hsh(p.id)}));
 const mineApp=new Set((my.data||[]).filter(a=>a.applicant_id===u).map(a=>a.job_id));
 S.jobs=(jb.data||[]).map(j=>({id:j.id,t:j.title,b:j.business_name,w:j.place||'',h:j.schedule||'',p:j.pay||'',a:mineApp.has(j.id)?1:0,ic:'briefcase',bid:j.business_id}));
 const jt=Object.fromEntries(S.jobs.map(j=>[j.id,j.t]));
 S.apps=(my.data||[]).filter(a=>a.applicant_id!==u).map(a=>({id:a.id,n:nm[a.applicant_id]||'Kandida',j:jt[a.job_id]||'',e:a.message||'',s:a.status==='hired'?'hired':'new'}));
 S.docs=(dc.data||[]).map(d=>({id:d.id,t:d.name,k:((d.name.split('.').pop()||'').toUpperCase().slice(0,4))||'DOC',s:d.size_bytes?Math.round(d.size_bytes/1024)+' KB':'',f:d.folder||'Dokiman',path:d.storage_path}));
 const now=new Date(),ev2={};
 (ev.data||[]).forEach(e=>{const d=new Date(e.starts_at);if(d.getMonth()!==now.getMonth()||d.getFullYear()!==now.getFullYear())return;(ev2[d.getDate()]??=[]).push([e.title,e.all_day?'Tout jou a':pad(d.getHours())+':'+pad(d.getMinutes()),{meeting:'c',deadline:'a',leave:'v'}[e.kind]])});
 S.ev=ev2;S.calDay=now.getDate();
 S.notif=(nt.data||[]).map(n=>[n.title,hm(n.created_at)]);LIVE.nun=(nt.data||[]).filter(n=>!n.read_at).length;
 S.clockIn=(at.data||[]).find(a=>a.user_id===u)?+new Date((at.data||[]).find(a=>a.user_id===u).clock_in):null;
 /* flux */
 const fd=[];S.tasks.forEach(t=>{if(t._fin)fd.push([+new Date(t._fin),[t.who,'te fini '+t.title,hm(t._fin),'m']]);else if(t._st)fd.push([+new Date(t._st),[t.who,'te kòmanse '+t.title,hm(t._st),'c']])});
 S.feed=fd.sort((a,b)=>b[0]-a[0]).slice(0,8).map(x=>x[1]);
 LIVE.att=aw.data||[];
 S.ents=[{n:bz.name,sec:bz.kind==='antrepriz'?'Antrepriz':'Biznis',code:bz.code,br:[['Sant prensipal',TEAM.length||1,'Sant']]}];S.ent=0;DEPT.length=0;LIVE.bz=bz;
 LIVE.loaded=true;
}
async function reload(keep){try{await loadAll();if(!['login'].includes(S.screen)){if(!LIVE.biz&&S.screen!=='setup')S.screen='setup';render(keep)}}catch(e){fail(e)}}


/* ---- prezans, è travay, abònman ---- */
const _tm=d=>pad(d.getHours())+':'+pad(d.getMinutes()),_DN=['Dimanch','Lendi','Madi','Mèkredi','Jedi','Vandredi','Samdi'];
LIVE.myWeek=()=>{const r=(LIVE.att||[]).filter(a=>a.user_id===LIVE.uid);let ms=0;r.forEach(a=>ms+=(a.clock_out?+new Date(a.clock_out):Date.now())-+new Date(a.clock_in));
 const m=Math.floor(ms/6e4);return{h:Math.floor(m/60)+'h '+pad(m%60),n:r.length}};
LIVE.pres=boss=>{const today=new Date().toDateString();
 if(boss)return TEAM.map(t=>{const id=LIVE.ids[t.n];const r=(LIVE.att||[]).filter(a=>a.user_id===id&&new Date(a.clock_in).toDateString()===today).reverse();
   if(!r.length)return[t.n,'—','Absan','x'];const f=r[0],l=r[r.length-1];return[t.n,_tm(new Date(f.clock_in)),l.clock_out?_tm(new Date(l.clock_out)):'—','c']});
 return(LIVE.att||[]).filter(a=>a.user_id===LIVE.uid).slice(0,7).map(a=>{const d=new Date(a.clock_in);return[d.toDateString()===today?'Jodi a':_DN[d.getDay()],_tm(d),a.clock_out?_tm(new Date(a.clock_out)):'—','c']})};
LIVE.presCount=()=>{const p=LIVE.pres(true);return p.filter(r=>r[3]!=='x').length+' sou '+p.length};
LIVE.trial=()=>{const b=LIVE.bz||{};if(b.plan!=='trial'||!b.trial_ends_at)return{txt:'Abònman: '+(b.plan||''),pct:100};
 const left=Math.max(0,Math.ceil((new Date(b.trial_ends_at)-Date.now())/864e5)),pct=Math.min(100,Math.round((92-left)/92*100));return{txt:'Abònman: 3 mwa gratis · '+left+' jou rete',pct:Math.max(3,pct)}};

/* ---- grafik semèn/mwa ---- */
LIVE.perf=()=>{const n=S.tasks.length;return n?Math.round(S.tasks.filter(t=>t.status==='done').length/n*100):0};
LIVE.wk=()=>{const done=S.tasks.filter(t=>t.status==='done'&&t.end);const d0=new Date();const dow=(d0.getDay()+6)%7;
 const wkv=[0,0,0,0,0,0];done.forEach(t=>{const d=new Date(t.end);if(Date.now()-d<7*864e5&&((d.getDay()+6)%7)<6)wkv[(d.getDay()+6)%7]++});
 const mv=[0,0,0,0];done.forEach(t=>{const a=Math.floor((Date.now()-t.end)/(7*864e5));if(a<4)mv[3-a]++});
 return{week:[wkv,['Len','Mad','Mèk','Jed','Van','Sam'],Math.min(dow,5)],month:[mv,['S1','S2','S3','S4'],3]}};

ACT.enter=async()=>{const reg=S.mode==='reg',em=$('#em').value.trim(),pw=$('#pw').value,fn=($('#fn')?.value||'').trim(),bn=($('#bn')?.value||'').trim(),cd=($('#cd')?.value||'').trim().toUpperCase(),asBoss=S.reg==='boss';
 if(!em||pw.length<8)return toast('Mete imel ak modpas (omwen 8 karaktè)');
 try{if(reg){if(!fn)return toast('Mete non konplè ou');
   const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:fn}}});if(error)throw error;
   if(!data.session)return toast('Kont lan kreye. Konfime imel ou, answit antre.');
   if(asBoss&&bn){const{error:e2}=await sb.rpc('create_business',{p_name:bn,p_kind:'biznis'});if(e2)throw e2}
   if(!asBoss&&cd){const{error:e3}=await sb.rpc('join_business',{p_code:cd});if(e3)throw e3}
  }else{const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error}
  await afterAuth()}catch(e){fail(e)}};

ACT.addprod=async()=>{const t=$('#np1').value.trim(),p=Number($('#np2').value)||0;if(!t)return toast('Mete non pwodwi a');

  c.msgs=(data||[]).map(m=>({w:LIVE.names[m.sender_id]||'?',k:'t',x:m.body||'['+m.kind+']',t:hm(m.created_at)}))}go('chat',{chat:a})};

/* voye mesaj nan chat */
const _mount=mount;mount=function(){_mount();const f=$('#cform');if(f)f.onsubmit=async e=>{e.preventDefault();const i=$('#cin'),x=i.value.trim();if(!x)return;i.value='';
 const{error}=await sb.from('messages').insert({chat_id:S.chat,body:x});if(error)return fail(error);

/* an dirèk */
let sub=null,tmr=null;
const soon=()=>{clearTimeout(tmr);tmr=setTimeout(()=>{if(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return soon();reload(true)},600)};
function subscribe(){if(sub)sb.removeChannel(sub);
 sub=sb.channel('luna-live').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},soon).on('postgres_changes',{event:'*',schema:'public',table:'members'},soon)
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications'},soon).on('postgres_changes',{event:'*',schema:'public',table:'attendance'},soon)
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{const m=p.new;if(m.sender_id===LIVE.uid)return;const c=S.chats.find(x=>x.id===m.chat_id);
   if(!c){soon();return}c.last=(LIVE.names[m.sender_id]||'')+': '+LIVE.prev(m);c.t=clock();c._t=Date.now();
   if(S.screen==='chat'&&S.chat===c.id){c.msgs.push(mapMsg(m));markRead(c.id);rerenderChat()}else{c.u=(c.u||0)+1;if(['chats','home'].includes(S.screen))render(true)}}).subscribe()}
/* ===== CHAT STIL WHATSAPP: foto, dokiman, mesaj vwa, ✓✓, mesaj ki poko li ===== */
LIVE.cr=LIVE.cr||{};LIVE.url={};
LIVE.prev=m=>m.kind==='image'?'📷 Foto':m.kind==='voice'?'🎤 Mesaj vwa':m.kind==='file'?'📄 '+(m.body||'Dokiman'):(m.body||'');
LIVE.unread=()=>S.chats.reduce((a,c)=>a+(c.u||0),0);
const mapMsg=m=>({id:m.id,s:m.sender_id,w:LIVE.names[m.sender_id]||'?',kind:m.kind,x:m.body||'',path:m.file_path,dur:m.duration_s,ts:+new Date(m.created_at),t:_tm(new Date(m.created_at))});
const dayLbl=ts=>{const d=new Date(ts),n=new Date(),y=new Date(n-864e5);return d.toDateString()===n.toDateString()?'Jodi a':d.toDateString()===y.toDateString()?'Yè':pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const readBy=(cid,ts)=>Object.entries(LIVE.cr).some(([k,v])=>k.startsWith(cid+':')&&!k.endsWith(':'+LIVE.uid)&&v&&+new Date(v)>=ts);
const tickH=(m,c)=>m.s!==LIVE.uid?'':`<span class="tk" data-ts="${m.ts}" style="font-weight:700;letter-spacing:-2px">${readBy(c.id,m.ts)?'<span style="color:#0a2a8a">✓✓</span>':'✓'}</span>`;
const mHtml=(m,c)=>{const mine=m.s===LIVE.uid;let b='';
 if(m.kind==='text')b=esc(m.x);
 else if(m.kind==='image')b=`<img class="lm" data-p="${esc(m.path)}" alt="foto" style="width:210px;max-width:100%;min-height:110px;border-radius:12px;display:block;background:rgba(56,232,255,.12);cursor:pointer">`;
 else if(m.kind==='voice')b=`<div class="vm" data-p="${esc(m.path)}">🎤 <audio controls preload="none" style="height:36px;max-width:200px"></audio> <span class="tiny">${m.dur?Math.floor(m.dur/60)+':'+pad(m.dur%60):''}</span></div>`;
 else b=`<button type="button" class="fm" data-p="${esc(m.path)}" style="all:unset;cursor:pointer;display:flex;gap:8px;align-items:center">📄 <b style="white-space:normal">${esc(m.x||'Dokiman')}</b></button>`;
 return `<div class="m ${mine?'me':''}" data-ts="${m.ts}">${c.g&&!mine?`<span class="by">${esc(m.w.split(' ')[0])}</span>`:''}${b}<small>${m.t} ${tickH(m,c)}</small></div>`};
V.chatroom=()=>{const c=S.chats.find(x=>x.id===S.chat);let last='',h='';
 c.msgs.forEach(m=>{const d=dayLbl(m.ts);if(d!==last){last=d;h+=`<div class="tiny muted" style="align-self:center;padding:3px 12px;border-radius:10px;background:rgba(3,10,20,.55)">${d}</div>`}h+=mHtml(m,c)});
 const sub=c.g?(c.cn||'')+' manm':(LIVE.here&&c.other&&LIVE.here.has(c.other)?'nan travay kounya':'');
 return `<div class="view" style="padding-bottom:12px" id="chatview"><div class="sub"><button class="ib" data-act="go" data-arg="chats" aria-label="Retounen">${I('back')}</button>${c.task?`<span class="state">${I('tasks')}</span>`:c.g?`<span class="state">${I('users')}</span>`:av(c.n)}<div style="flex:1;min-width:0"><b style="display:block;font-family:var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.n)}</b><small class="muted tiny">${sub}</small></div></div>
 <div class="msgs">${h||'<div class="note" style="padding:30px">Pa gen mesaj ankò. Voye premye a.</div>'}</div></div>
 <form class="composer" id="cform"><input type="file" id="cf" hidden accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv"><button type="button" class="ib" id="catt" aria-label="Foto oswa dokiman">${I('image')}</button><input id="cin" placeholder="Ekri yon mesaj..." autocomplete="off"><button type="button" class="ib" id="cmic" aria-label="Mesaj vwa">${I('mic')}</button><button class="ib" style="background:linear-gradient(160deg,#7ff1ff,#1db8dc);color:#021018" aria-label="Voye">${I('send')}</button></form>`};
async function signed(path){const c=LIVE.url[path];if(c&&c.exp>Date.now())return c.u;const r=await sb.storage.from('chat-media').createSignedUrl(path,3600);if(r.error)return null;LIVE.url[path]={u:r.data.signedUrl,exp:Date.now()+3e6};return r.data.signedUrl}
function hydrateMedia(){$$('#chatview [data-p]').forEach(async el=>{if(el.dataset.ok)return;el.dataset.ok=1;const u=await signed(el.dataset.p);if(!u)return;
 if(el.tagName==='IMG'){el.src=u;el.onclick=()=>window.open(u,'_blank')}else if(el.classList.contains('vm'))el.querySelector('audio').src=u;else el.onclick=()=>window.open(u,'_blank')})}
function rerenderChat(){const i=$('#cin'),v=i?i.value:'';render();const n=$('#cin');if(n&&v)n.value=v}
async function sendMsg(row){const{data,error}=await sb.from('messages').insert({chat_id:S.chat,...row}).select().single();if(error)return fail(error);
 const c=S.chats.find(x=>x.id===S.chat);c.msgs.push(mapMsg(data));c.last='Mwen: '+LIVE.prev(data);c.t=clock();c._t=Date.now();rerenderChat()}
async function uploadMedia(file){const path=`${LIVE.biz.id}/${S.chat}/${Date.now()}-${file.name.replace(/[^\w.-]/g,'_')}`;
 const{error}=await sb.storage.from('chat-media').upload(path,file,{contentType:file.type||undefined});if(error)throw error;return path}
let _rec=null;
async function micToggle(){if(_rec){_rec.stop();return}
 if(!navigator.mediaDevices||!window.MediaRecorder)return toast('Navigatè sa a pa sipòte mesaj vwa');
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const mt=MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':(MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'');
  const mr=new MediaRecorder(st,mt?{mimeType:mt}:{}),chunks=[],t0=Date.now();_rec=mr;const b=$('#cmic');if(b)b.style.background='var(--rose)';
  const tim=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000),i=$('#cin');if(i)i.placeholder='● '+Math.floor(s/60)+':'+pad(s%60)+' · peze mikwo a pou voye'},400);
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=async()=>{clearInterval(tim);st.getTracks().forEach(t=>t.stop());_rec=null;const dur=Math.round((Date.now()-t0)/1000);
   if(dur<1){rerenderChat();return}const type=mr.mimeType||mt||'audio/webm';const f=new File([new Blob(chunks,{type})],'vwa.'+(type.includes('mp4')?'m4a':'webm'),{type});
   try{await sendMsg({kind:'voice',file_path:await uploadMedia(f),duration_s:dur})}catch(e){fail(e);rerenderChat()}};
  mr.start()}catch(e){toast('Pa gen aksè ak mikwo a. Otorize l nan paramèt navigatè a.')}}
function paintTicks(){const c=S.chats.find(x=>x.id===S.chat);if(!c)return;$$('#chatview .m.me').forEach(el=>{const t=el.querySelector('.tk');if(t)t.innerHTML=readBy(c.id,+el.dataset.ts)?'<span style="color:#0a2a8a">✓✓</span>':'✓'})}
async function markRead(id){const now=new Date().toISOString();LIVE.cr[id+':'+LIVE.uid]=now;const c=S.chats.find(x=>x.id===id);if(c)c.u=0;sb.from('chat_members').update({last_read_at:now}).eq('chat_id',id).eq('user_id',LIVE.uid).then(()=>{})}
const _m2=mount;mount=function(){_m2();if(S.screen!=='chat')return;const f=$('#cform');if(!f)return;
 hydrateMedia();markRead(S.chat);
 $('#catt').onclick=()=>$('#cf').click();$('#cmic').onclick=micToggle;if(_rec)$('#cmic').style.background='var(--rose)';
 $('#cf').onchange=async e=>{const file=e.target.files[0];if(!file)return;toast('Ap voye…');try{const path=await uploadMedia(file);await sendMsg({kind:file.type.startsWith('image/')?'image':'file',file_path:path,body:file.type.startsWith('image/')?null:file.name})}catch(er){fail(er)}};
 f.onsubmit=async e=>{e.preventDefault();const i=$('#cin'),x=i.value.trim();if(!x)return;i.value='';await sendMsg({kind:'text',body:x});const n=$('#cin');n&&n.focus()}};
ACT.chat=async a=>{const c=S.chats.find(x=>x.id===a);if(!c)return;
 const[mm,cm]=await Promise.all([sb.from('messages').select('*').eq('chat_id',a).order('created_at').limit(300),sb.from('chat_members').select('user_id,last_read_at').eq('chat_id',a)]);
 (cm.data||[]).forEach(x=>LIVE.cr[a+':'+x.user_id]=x.last_read_at);c.msgs=(mm.data||[]).map(mapMsg);c.u=0;go('chat',{chat:a})};
setInterval(async()=>{if(S.screen!=='chat'||!S.chat||document.hidden)return;const id=S.chat;const{data}=await sb.from('chat_members').select('user_id,last_read_at').eq('chat_id',id);
 if(!data||S.chat!==id)return;let ch=false;data.forEach(x=>{const k=id+':'+x.user_id;if(LIVE.cr[k]!==x.last_read_at&&x.user_id!==LIVE.uid){LIVE.cr[k]=x.last_read_at;ch=true}});if(ch)paintTicks()},5000);


/* ===== bouton ki te rete yo ===== */
LIVE.roleLine=()=>{const c=r=>TEAM.filter(t=>t.r===r).length;return '1 Boss · '+c('Manadjè')+' Manadjè · '+c('Recrutement')+' Recrutement · '+c('Anplwaye')+' Anplwaye'};
ACT.role=()=>toast('Wòl ou fikse pa biznis la: '+(ROLE_LBL[LIVE.role]||''));
ACT.addent=()=>{S.sheet=null;toast('Pou kounya yon kont gen yon sèl biznis. Pi plis ap vini.');render()};
ACT.rejapp=async a=>{const p=S.apps[a];const{error}=await sb.rpc('decide_application',{p_application:p.id,p_accept:false});if(error)return fail(error);toast('Aplikasyon an refize');await reload(true)};
ACT.rejmem=async a=>{const p=S.pending[a];const{error}=await sb.rpc('decide_member',{p_business:LIVE.biz.id,p_user:p.uid,p_accept:false,p_role:'employee'});if(error)return fail(error);toast('Demann lan refize');await reload(true)};
ACT.dmwith=async n=>{const id=LIVE.ids[n];if(!id||id===LIVE.uid){toast('Se ou menm sa a');return}S.sheet=null;
 const ex=S.chats.find(c=>c.other===id&&!c.g&&!c.task);if(ex)return ACT.chat(ex.id);
 const{data,error}=await sb.rpc('create_chat',{p_business:LIVE.biz.id,p_kind:'direct',p_members:[id]});if(error)return fail(error);await loadAll();ACT.chat(data.id)};
ACT.addjob=async()=>{const t=$('#nj1').value.trim();if(!t)return toast('Mete tit travay la');
 const{error}=await sb.from('jobs').insert({business_id:LIVE.biz.id,title:t,place:$('#nj2').value.trim()||null,schedule:$('#nj3').value.trim()||null,pay:$('#nj4').value.trim()||null,description:$('#nj5').value.trim()||null});
 if(error)return fail(error);S.sheet=null;toast('Travay la poste');await reload()};
ACT.addev=async()=>{const t=$('#ne_t').value.trim(),d=$('#ne_d').value;if(!t||!d)return toast('Mete tit ak dat');
 const{error}=await sb.from('events').insert({business_id:LIVE.biz.id,title:t,kind:$('#ne_k').value,starts_at:new Date(d).toISOString()});if(error)return fail(error);S.sheet=null;toast('Evènman ajoute');await reload()};
ACT.pickdoc=()=>{const i=document.createElement('input');i.type='file';i.onchange=async()=>{const f=i.files[0];if(!f)return;toast('Ap voye…');
 const path=`${LIVE.biz.id}/${Date.now()}-${f.name.replace(/[^\w.-]/g,'_')}`;const up=await sb.storage.from('documents').upload(path,f,{contentType:f.type||undefined});if(up.error)return fail(up.error);
 const{error}=await sb.from('documents').insert({business_id:LIVE.biz.id,name:f.name,kind:f.type||null,storage_path:path,size_bytes:f.size});if(error)return fail(error);toast('Dokiman ajoute');await reload(true)};i.click()};
const _sh=ACT.sheet;ACT.sheet=a=>{_sh(a);if(a==='notif'&&LIVE.nun){LIVE.nun=0;sb.from('notifications').update({read_at:new Date().toISOString()}).eq('user_id',LIVE.uid).is('read_at',null).then(()=>render(true))}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act="toast"]');if(b&&(b.dataset.arg||'').startsWith('Kòd ')&&navigator.clipboard)navigator.clipboard.writeText(CODE).catch(()=>{})},true);

/* dokiman: louvri vre fichye a */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act="toast"]');if(!b||!b.closest('#list-docs'))return;const n=b.querySelector('b')?.textContent;const d=S.docs.find(x=>x.t===n);if(d){e.stopPropagation();ACT.opendoc(d.id)}},true);
/* depa */
(async()=>{try{const{data:{session}}=await sb.auth.getSession();if(session){LIVE.uid=session.user.id;await loadAll();subscribe();go(LIVE.biz?'home':'setup')}}catch(e){console.error(e)}})();

</script>
